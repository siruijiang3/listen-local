name: Check and build Windows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install locked dependencies
        run: |
          npm ci
          python -m pip install -r desktop/backend/requirements-build-lock.txt
      - name: Test lightweight application
        run: |
          npm run build
          npm test
          python -m unittest discover -s desktop/tests -v
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Package native core
        run: python scripts/build-desktop-core.py
      - name: Build Windows installer
        run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
